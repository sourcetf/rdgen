name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string
      config_b64:
        description: 'base64-encoded config JSON; when set, no zip download is needed'
        required: false
        type: string
        default: ''

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Install pyzipper
        if: ${{ inputs.config_b64 != '' && inputs.config_b64 != 'skip' }}
        run: pip install pyzipper

      - name: Build config zip from dispatch input
        if: ${{ inputs.config_b64 != '' && inputs.config_b64 != 'skip' }}
        shell: python
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          import base64
          import json
          import os

          raw = base64.b64decode('${{ inputs.config_b64 }}')
          data = json.loads(raw)  # validate before writing
          print(f"Received dispatch config with keys: {sorted(data.keys())}")
          with open('secrets.json', 'wb') as f:
              f.write(raw)

          import pyzipper
          with pyzipper.AESZipFile('secrets.zip', 'w', compression=pyzipper.ZIP_LZMA, encryption=pyzipper.WZ_AES) as zf:
              zf.setpassword(os.environ['ZIP_PASSWORD'].encode())
              zf.write('secrets.json', arcname='secrets.json')
          print("secrets.zip built from dispatch config")

      - name: Download with Retry
        if: ${{ inputs.config_b64 == '' || inputs.config_b64 == 'skip' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 60
          shell: python
          command: |
            import requests
            import json
            import time
            import sys

            try:
                input_data = json.loads('${{ inputs.zip_url_json }}')
            except Exception:
                input_data = {}
            url = input_data.get('url') if isinstance(input_data, dict) else None
            file = input_data.get('file') if isinstance(input_data, dict) else None
            if not url or not file:
                print("WARNING: no config zip URL provided; CI will build with default settings")
                sys.exit(0)

            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url + "/get_zip?filename=" + file, timeout=20)
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    print(f"WARNING: download attempt {attempt + 1} failed: {e}")
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else:
                        print("WARNING: config zip download failed; CI will build with default settings")
                        sys.exit(0)

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
          if-no-files-found: ignore
